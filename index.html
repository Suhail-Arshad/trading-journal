                        <label class="flex items-center gap-2 p-2.5 rounded-xl bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" value="FOMO Entry" class="mistake-cb rounded bg-slate-800 border-slate-700 text-indigo-600">
                            <span>FOMO Entry</span>
                        </label>
                        <label class="flex items-center gap-2 p-2.5 rounded-xl bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" value="Ignored Signals" class="mistake-cb rounded bg-slate-800 border-slate-700 text-indigo-600">
                            <span>Ignored Signals</span>
                        </label>
                        <label class="flex items-center gap-2 p-2.5 rounded-xl bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" value="No Clear Plan" class="mistake-cb rounded bg-slate-800 border-slate-700 text-indigo-600">
                            <span>No Clear Plan</span>
                        </label>
                        <label class="flex items-center gap-2 p-2.5 rounded-xl bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" value="Ignored Stop Loss" class="mistake-cb rounded bg-slate-800 border-slate-700 text-indigo-600">
                            <span>Ignored Stop Loss</span>
                        </label>
                        <label class="flex items-center gap-2 p-2.5 rounded-xl bg-rose-950/40 border border-rose-500/50 cursor-pointer">
                            <input type="checkbox" value="No Mistakes" checked class="mistake-cb rounded bg-slate-800 border-slate-700 text-emerald-500">
                            <span class="text-rose-300 font-bold">No Mistakes</span>
                        </label>
                        <label class="flex items-center gap-2 p-2.5 rounded-xl bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" value="Greed" class="mistake-cb rounded bg-slate-800 border-slate-700 text-indigo-600">
                            <span>Greed</span>
                        </label>
                        <label class="flex items-center gap-2 p-2.5 rounded-xl bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" value="Against Trend" class="mistake-cb rounded bg-slate-800 border-slate-700 text-indigo-600">
                            <span>Against Trend</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-300 block mb-1">Lessons Learned</label>
                    <textarea id="lessonsText" rows="2" placeholder="What did you learn from this trade?" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-800">
                    <button onclick="closeLogModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300">
                        Reset
                    </button>
                    <button onclick="saveTradeSuccess()" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white shadow-lg shadow-indigo-600/30">
                        Save Trade
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- SUCCESS NOTIFICATION POPUP -->
    <div id="successModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-[#0f1424] border border-indigo-500/50 rounded-2xl max-w-md w-full p-8 text-center shadow-2xl relative">
            <div class="w-14 h-14 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto mb-4 border border-emerald-500/40">
                <i data-lucide="check" class="w-8 h-8"></i>
            </div>
            
            <h2 class="text-2xl font-extrabold text-white mb-1">Trade Saved Successfully!</h2>
            <p class="text-xs text-slate-400 italic mb-6">"Pain is information. Capture it, study it, grow from it."</p>

            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 mb-6 text-left">
                <p class="text-xs text-slate-400 font-semibold mb-3">Comparison with Previous Day's P&L</p>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div class="bg-[#0f1424] p-3 rounded-xl border border-slate-800">
                        <span class="text-[10px] text-slate-400 block">Today's P&L</span>
                        <span class="text-base font-bold text-emerald-400">+11,228.60</span>
                    </div>
                    <div class="bg-[#0f1424] p-3 rounded-xl border border-slate-800">
                        <span class="text-[10px] text-slate-400 block">Yesterday's P&L</span>
                        <span class="text-base font-bold text-emerald-400">+2,408.90</span>
                    </div>
                </div>
                <div class="flex items-center text-xs text-indigo-300">
                    <i data-lucide="arrow-up" class="w-4 h-4 mr-1 text-emerald-400"></i>
                    <span>You saw an increase of <strong>8,819.70</strong> in your pnl compared to the last session!</span>
                </div>
            </div>

            <button onclick="document.getElementById('successModal').classList.add('hidden')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30">
                Keep Journaling
            </button>
        </div>
    </div>

    <script>
        window.onload = function() {
            lucide.createIcons();
            initChart();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        }

        function openLogModal() {
            document.getElementById('logModal').classList.remove('hidden');
        }

        function closeLogModal() {
            document.getElementById('logModal').classList.add('hidden');
        }

        function saveTradeSuccess() {
            closeLogModal();
            document.getElementById('successModal').classList.remove('hidden');
        }

        function initChart() {
            const ctx = document.getElementById('equityChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Thu 30', 'Fri 31', 'Sat 01', 'Sun 02', 'Mon 03', 'Tue 04', 'Today'],
                    datasets: [{
                        label: 'P&L (₹)',
                        data: [2400, 3100, 3100, 3100, 2408, 11228, 11228],
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
